<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOS - Registration Page</title>
    <link rel="stylesheet" href="./registration.css">
</head>
<body>

<div class="overlay">
    <h1>Mens Online Shopping</h1>
    <p>Welcome to our new branded online men's clothing shop. Register to start shopping.</p>
    <hr>

    <div class="register-container">
        <div class="wrapper">
            <h3>Registration Form</h3>

            <form onsubmit="register(event)">
                <div class="input-box">
                    <input type="text" placeholder="Username*" required>
                </div>
                <div class="input-box">
                    <input type="email" placeholder="Mail ID*" required>
                </div>
                <div class="input-box">
                    <input type="tel" placeholder="Mobile Number*" required>
                </div>
                <div class="input-box">
                    <input type="password" placeholder="Password*" required>
                </div>
                <div class="terms">
                    <label>
                        <input type="checkbox" required>
                        Yes, I agree to the <a href="#">Terms & Conditions</a>
                    </label>
                </div>
                <button type="submit" class="btn" onclick="window.location.href='./login page.html'">Register</button>
                <div class="login-link">
                    <a href="./login page.html">I already have an account</a>
                </div>
            </form>
        </div>
    </div>
</div>
<div id="successPopup" class="popup">
    <div class="popup-content">
        <h3>🎉 Registration Successful!</h3>
        <p>Redirecting to Login Page...</p>
    </div>
</div>
<script src="./script.js"></script>
</body>
</html>

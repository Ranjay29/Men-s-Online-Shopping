<!DOCTYPE html>
<html lang="en">
<head>
<title>MOS-Login Page</title>
<link rel="stylesheet" href="./login.css">
</head>
<body>
    <h1>Mens Online Shopping</h1>
    <p>Welcome to our new branded online men's clothing shop. Here, you have only few more steps to enter our shop.</p>
<hr>
<div class="login-container">
    <div class="wrapper">
        <h3>Log In</h3>
        <form action="a">
            <div class="input-box">
                <input type="text" placeholder="Username*" required>
            </div>
            <div class="input-box">
                <input type="password" placeholder="Password*" required>
            </div>
            <button type="submit" class="btn" onclick="login()" href="./index.html">Login</button>
            <div class="register-link">
                <a href="./registration page.html">Don't have an account?</a>
            </div>
        </form>
    </div>
</div>
<script src="./script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOS - Login Page</title>
    <link rel="stylesheet" href="./login.css">
</head>
<body>

    <div class="overlay">
        <h1 id="main-title">Mens Online Shopping</h1>
        <p>Welcome to our new branded online men's clothing shop. Just a few more steps to enter our shop.</p>
        <hr>

        <div class="login-container">
            <div class="wrapper">
                <h3>Log In</h3>
                <form onsubmit="login(event)">
                    <div class="input-box">
                        <input type="text" placeholder="Username*" required>
                    </div>
                    <div class="input-box">
                        <input type="password" placeholder="Password*" required>
                    </div>
                    <button type="submit" class="btn" onclick="window.location.href='./home.html'">Login</button>

                    <div class="register-link">
                        <a href="./index.html">Don't have an account?</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

<script src="./script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<title>MOS-Registeration page</title>
<link rel="stylesheet" href="./registration.css">
</head>
<body>
    <h1>Mens Online Shopping</h1>
    <p>Welcome to our new branded online men's clothing shop. Here, you go to the shop to purchase once you register your details.</p>
<hr>
<div class="register-container">
    <div class="wrapper">
        <h3>Registration Form</h3>
        <form action="a">
            <div class="input-box">
                <input type="text" placeholder="Username" required>
            </div>
            <div class="input-box">
                <input type="mail" placeholder="Mail ID" required>
            </div>
            <div class="input-box">
                <input type="digit" placeholder="Mobile Number" required>
            </div>
            <div class="input-box">
                <input type="password" placeholder="Password" required>
            </div>
            <div class="T&C">
                <label><input type="checkbox">Yes,I agree <a href="#">T&C</a></label>
            </div>
            <button type="submit" class="btn" onclick="register()">Register</button>
            <div class="login-link">
                <a href="./login page.html">I have an account !!</a>
            </div>
        </form>
    </div>
</div>
<script src="./script.js"></script>
</body>
</html>
